<app-camera (image)="getPredictions($event)"></app-camera>
@if (isLoading()) {
  <span class="loading loading-spinner text-primary loading-lg"></span>
} @else if (predictions().length > 0) {
  <div>
    <h3>Predictions</h3>
    <ul>
      @for (prediction of predictions(); track prediction.pokedex_number) {
        <li>{{ prediction.pokedex_number }} - {{ prediction.pokemon_name }}: {{ prediction.probability | percent:'1.2-2' }}</li>
      }
    </ul>
  </div>
}
